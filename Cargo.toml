[package]
name = "tkt"
version = "0.4.0"
edition = "2021"
rust-version = "1.85.0"
description = "Track tasks as markdown files in your git repo"
license = "MIT"
repository = "https://github.com/smileynet/tkt"
homepage = "https://github.com/smileynet/tkt"
documentation = "https://github.com/smileynet/tkt#usage"
readme = "README.md"
keywords = ["tickets", "task-management", "git", "todo", "markdown"]
categories = ["command-line-utilities", "development-tools"]
include = ["/assets/pre-commit.sh", "/src/**", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
anyhow = "1"
thiserror = "2"
dirs = "5"
serde_json = "1"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
