[package]
name = "tkt"
version = "0.1.0"
edition = "2021"
description = "Git-native ticket CLI — frontmatter-driven work tracking in .tickets/"
license = "MIT"
repository = "https://github.com/smileynet/tkt"
keywords = ["cli", "tickets", "git", "project-management"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
anyhow = "1"
thiserror = "2"
dirs = "5"
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1


# Config for 'cargo dist'
[workspace.metadata.dist]
# CI backends to target
ci = "github"
# Target platforms
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
# Installers to generate
installers = ["shell", "powershell"]
# Archive format
unix-archive = ".tar.gz"
windows-archive = ".zip"
