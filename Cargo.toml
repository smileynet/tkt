[package]
name = "tkt"
version = "0.1.0"
edition = "2021"
description = "Git-native ticket CLI — frontmatter-driven work tracking in .tickets/"
license = "MIT"
repository = "https://github.com/smileynet/tkt"
keywords = ["cli", "tickets", "git", "project-management"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
