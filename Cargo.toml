[package]
name = "tkt"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
description = "Track tasks as markdown files in your git repo"
license = "MIT"
repository = "https://github.com/smileynet/tkt"
homepage = "https://github.com/smileynet/tkt"
documentation = "https://github.com/smileynet/tkt#usage"
readme = "README.md"
keywords = ["tickets", "task-management", "git", "todo", "markdown"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".tickets/", ".memory/", ".codex/", ".github/", "tests/"]

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
anyhow = "1"
thiserror = "2"
dirs = "5"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Config for 'dist'
[workspace.metadata.dist]
# CI backends to support
ci = "github"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# The installers to generate for each app
installers = ["shell", "powershell"]
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".zip"
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Don't complain about our self-hosted runner modifications
allow-dirty = ["ci"]
