# cargo-release configuration for tkt
# Docs: https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md
# Single-crate project: settings are top-level (a [workspace] table is only for
# actual Cargo workspaces and fails to parse here).

allow-branch = ["main"]
# CHANGELOG.md is curated manually. `git cliff` may be used only to generate a
# review candidate; it must never overwrite the release notes cargo-release tags.
pre-release-commit-message = "chore(release): v{{version}}"
tag-message = "tkt v{{version}}"
tag-prefix = "v"
tag-name = "v{{version}}"
sign-tag = false
push = true
publish = true
verify = true

# Keep both plugin manifests on the crate version (Claude Code caches plugins by
# version; tests/plugin_manifests.rs fails if either drifts).
pre-release-replacements = [
  { file = "plugin.json", search = '"version": "[^"]+"', replace = '"version": "{{version}}"', exactly = 1 },
  { file = ".claude-plugin/plugin.json", search = '"version": "[^"]+"', replace = '"version": "{{version}}"', exactly = 1 },
]
