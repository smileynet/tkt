# git-cliff configuration for tkt
# Generates Keep a Changelog format from conventional commits
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/2.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
          {% if commit.breaking %} (**Breaking**){% endif %}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/smileynet/tkt/compare/{{ release.previous.version }}...{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: \
                https://github.com/smileynet/tkt/releases/tag/{{ release.version }}
        {% endif -%}
    {% else -%}
        [Unreleased]: https://github.com/smileynet/tkt/compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_preprocessors = [
    { pattern = '\\(#([0-9]+)\\)', replace = "([#${1}](https://github.com/smileynet/tkt/issues/${1}))" },
]
commit_parsers = [
    # --- Skip noise (evaluated first; first match wins) ---
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore\\(tickets\\)", skip = true },
    { message = "^chore\\(deps\\)", skip = true },
    { message = "^ticket", skip = true },
    { message = "^test", skip = true },
    { message = "^docs", skip = true },
    { message = "^ci", skip = true },
    { message = "^build", skip = true },
    { message = "^style", skip = true },
    { message = "^chore", skip = true },
    { message = "^Merge ", skip = true },
    { message = "^revert", skip = true },
    { footer = "^changelog: ?ignore", skip = true },
    # --- Breaking changes surface first (protect_breaking_commits keeps them) ---
    { message = "^\\w+!", group = "<!-- 0 -->Changed" },
    { body = ".*BREAKING CHANGE", group = "<!-- 0 -->Changed" },
    # --- Kept, user-facing ---
    { message = "^feat", group = "<!-- 1 -->Added" },
    { message = "^fix", group = "<!-- 2 -->Fixed" },
    { message = "^perf", group = "<!-- 3 -->Changed" },
    { message = "^refactor", group = "<!-- 3 -->Changed" },
    # --- Catch-all: keep unconventional commits (never silently drop) ---
    { message = ".*", group = "<!-- 4 -->Changed" },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
