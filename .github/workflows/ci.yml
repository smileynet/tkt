name: CI

# Disabled — we verify locally before commit (cargo fmt && cargo clippy && cargo test)
# Trigger manually if needed:
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
        env:
          DO_NOT_TRACK: "1"
