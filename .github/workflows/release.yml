# Generated by tools/generate-release-workflow.mjs from cargo-dist 0.32.0. Do not edit.
name: Stage release artifacts
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed candidate commit (40 lowercase hex)
        required: true
        type: string
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.identity.outputs.tag }}
      tag-flag: ${{ format('--tag={0}', steps.identity.outputs.tag) }}
      publishing: "false"
    env: {}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked maintainer dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify candidate identity
        id: identity
        run: node tools/release-ci.mjs identity
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache-attempt-${{ github.run_attempt }}
          path: ~/.cargo/bin/dist
          if-no-files-found: error
      - id: plan
        run: |
          dist plan --tag "$CANDIDATE_TAG" --output-format=json > plan-dist-manifest.json
          echo "manifest=$(jq -c . plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
        env:
          CANDIDATE_TAG: ${{ steps.identity.outputs.tag }}
      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest-attempt-${{ github.run_attempt }}
          path: plan-dist-manifest.json
          if-no-files-found: error
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked maintainer dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify candidate identity
        id: identity
        run: node tools/release-ci.mjs identity
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*-attempt-${{ github.run_attempt }}
          path: target/distrib/
          merge-multiple: true
          digest-mismatch: error
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
          if-no-files-found: error
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: ubuntu-22.04
    env:
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked maintainer dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify candidate identity
        id: identity
        run: node tools/release-ci.mjs identity
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache-attempt-${{ github.run_attempt }}
          path: ~/.cargo/bin/
          digest-mismatch: error
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*-attempt-${{ github.run_attempt }}
          path: target/distrib/
          merge-multiple: true
          digest-mismatch: error
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
          if-no-files-found: error
  build-crate:
    needs:
      - plan
    runs-on: ubuntu-22.04
    steps:
      - &a1
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked maintainer dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify candidate identity
        id: identity
        run: node tools/release-ci.mjs identity
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and verify clean source crate
        run: cargo package --locked --target-dir target/crate-stage
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-crate-attempt-${{ github.run_attempt }}
          path: target/crate-stage/package/*.crate
          if-no-files-found: error
  seal-stage:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - build-crate
    runs-on: ubuntu-22.04
    steps:
      - *a1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked maintainer dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify candidate identity
        id: identity
        run: node tools/release-ci.mjs identity
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*-attempt-${{ github.run_attempt }}
          path: target/stage-input
          merge-multiple: true
          digest-mismatch: error
      - name: Seal exact built files
        run: node tools/release-ci.mjs collect target/stage-input target/sealed-stage
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: tkt-sealed-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/sealed-stage/*
          if-no-files-found: error
