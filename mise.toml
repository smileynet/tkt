# mise task definitions for tkt
# Run with: mise run <task>

[tasks.release]
description = "Prepare or verify a local release candidate (read-only by default)"
run = "bash tools/release.sh"

[tasks."release:tools"]
description = "Verify vendored release tools and entry points"
run = "node tools/check-tools.mjs"

[tasks.check]
description = "Run release-tool, fmt, clippy and Rust test gates"
run = """
node tools/check-tools.mjs && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
"""

[tasks."check:release"]
description = "Run all tooling regressions and the Rust gate for release verification"
run = "node tools/check-tools.mjs --release && cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test"

[tasks.deploy]
description = "Deploy tkt skills to agent harness scan roots and refresh the Antigravity (agy) plugin"
run = "tools/deploy-skills.sh"

[tasks."deploy:dry-run"]
description = "Preview what deploy would do"
run = "tools/deploy-skills.sh --dry-run"
